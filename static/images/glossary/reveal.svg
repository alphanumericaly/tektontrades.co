<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600">
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="160" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#2C2C2A">Double door inset cabinet</text>

  <!-- Cabinet body -->
  <rect x="30" y="52" width="260" height="360" rx="3" fill="#C9A87A" stroke="#7A5C38" stroke-width="2"/>

  <!-- Face frame rails and stiles -->
  <rect x="30" y="52" width="260" height="26" rx="2" fill="#D4B58A" stroke="#7A5C38" stroke-width="1.5"/>
  <rect x="30" y="386" width="260" height="26" rx="2" fill="#D4B58A" stroke="#7A5C38" stroke-width="1.5"/>
  <rect x="30" y="52" width="26" height="360" rx="2" fill="#D4B58A" stroke="#7A5C38" stroke-width="1.5"/>
  <rect x="264" y="52" width="26" height="360" rx="2" fill="#D4B58A" stroke="#7A5C38" stroke-width="1.5"/>
  <rect x="147" y="52" width="26" height="360" rx="2" fill="#D4B58A" stroke="#7A5C38" stroke-width="1.5"/>

  <!-- Interior shadows -->
  <rect x="56" y="78" width="91" height="308" fill="#8B6E50" opacity="0.3"/>
  <rect x="173" y="78" width="91" height="308" fill="#8B6E50" opacity="0.3"/>

  <!-- Left door -->
  <rect x="62" y="84" width="79" height="296" rx="2" fill="#EDD9AA" stroke="#9A7248" stroke-width="1.2"/>
  <rect x="70" y="96" width="63" height="272" rx="2" fill="#E2C88A" stroke="#B08050" stroke-width="0.8" opacity="0.8"/>
  <circle cx="135" cy="232" r="5" fill="#8B7355" stroke="#5A4528" stroke-width="1"/>
  <circle cx="135" cy="232" r="2.5" fill="#A08860"/>

  <!-- Right door -->
  <rect x="179" y="84" width="79" height="296" rx="2" fill="#EDD9AA" stroke="#9A7248" stroke-width="1.2"/>
  <rect x="187" y="96" width="63" height="272" rx="2" fill="#E2C88A" stroke="#B08050" stroke-width="0.8" opacity="0.8"/>
  <circle cx="185" cy="232" r="5" fill="#8B7355" stroke="#5A4528" stroke-width="1"/>
  <circle cx="185" cy="232" r="2.5" fill="#A08860"/>

  <!-- Reveal gaps blue highlight -->
  <rect x="56" y="78" width="6" height="308" fill="#378ADD" opacity="0.4"/>
  <rect x="141" y="78" width="6" height="308" fill="#378ADD" opacity="0.4"/>
  <rect x="56" y="78" width="91" height="6" fill="#378ADD" opacity="0.4"/>
  <rect x="56" y="380" width="91" height="6" fill="#378ADD" opacity="0.4"/>
  <rect x="173" y="78" width="6" height="308" fill="#378ADD" opacity="0.4"/>
  <rect x="258" y="78" width="6" height="308" fill="#378ADD" opacity="0.4"/>
  <rect x="173" y="78" width="91" height="6" fill="#378ADD" opacity="0.4"/>
  <rect x="173" y="380" width="91" height="6" fill="#378ADD" opacity="0.4"/>

  <!-- Callout highlight box on right reveal -->
  <rect x="254" y="150" width="14" height="120" fill="#378ADD" opacity="0.2" rx="2"/>
  <rect x="254" y="150" width="14" height="120" fill="none" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 2" rx="2"/>

  <!-- Callout lines to zoom panel -->
  <line x1="268" y1="150" x2="380" y2="130" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 3" opacity="0.7"/>
  <line x1="268" y1="270" x2="380" y2="430" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 3" opacity="0.7"/>

  <!-- ZOOM PANEL background -->
  <rect x="380" y="100" width="276" height="360" rx="10" fill="#F7F5F0" stroke="#C8C4BC" stroke-width="1"/>

  <!-- Zoom panel titles -->
  <text x="518" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#2C2C2A">Reveal — zoomed in</text>
  <text x="518" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888780">Gap runs on all four edges of every door</text>

  <!-- Face frame stile in zoom -->
  <rect x="396" y="158" width="90" height="278" rx="2" fill="#D4B58A" stroke="#7A5C38" stroke-width="1.5"/>
  <line x1="412" y1="165" x2="412" y2="428" stroke="#C4A070" stroke-width="0.7" opacity="0.5"/>
  <line x1="428" y1="165" x2="428" y2="428" stroke="#C4A070" stroke-width="0.7" opacity="0.5"/>
  <line x1="444" y1="165" x2="444" y2="428" stroke="#C4A070" stroke-width="0.7" opacity="0.5"/>
  <line x1="460" y1="165" x2="460" y2="428" stroke="#C4A070" stroke-width="0.7" opacity="0.5"/>
  <line x1="476" y1="165" x2="476" y2="428" stroke="#C4A070" stroke-width="0.7" opacity="0.5"/>
  <text x="441" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Face frame stile</text>

  <!-- Reveal gap in zoom -->
  <rect x="486" y="158" width="30" height="278" fill="#378ADD" opacity="0.35"/>
  <rect x="486" y="158" width="30" height="278" fill="none" stroke="#185FA5" stroke-width="1"/>
  <!-- Dimension arrows -->
  <line x1="501" y1="175" x2="501" y2="418" stroke="#185FA5" stroke-width="1.5" marker-start="url(#arrowA)" marker-end="url(#arrowA)"/>
  <text x="501" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0C447C">3/16"</text>
  <text x="501" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#185FA5">to 1/4"</text>
  <text x="501" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#185FA5">Reveal</text>

  <!-- Inset door in zoom -->
  <rect x="516" y="158" width="124" height="278" rx="2" fill="#EDD9AA" stroke="#9A7248" stroke-width="1.2"/>
  <rect x="526" y="170" width="104" height="254" rx="2" fill="#E2C88A" stroke="#B08050" stroke-width="0.8" opacity="0.8"/>
  <line x1="534" y1="165" x2="534" y2="428" stroke="#C8A878" stroke-width="0.6" opacity="0.5"/>
  <line x1="552" y1="165" x2="552" y2="428" stroke="#C8A878" stroke-width="0.6" opacity="0.5"/>
  <line x1="570" y1="165" x2="570" y2="428" stroke="#C8A878" stroke-width="0.6" opacity="0.5"/>
  <line x1="590" y1="165" x2="590" y2="428" stroke="#C8A878" stroke-width="0.6" opacity="0.5"/>
  <line x1="612" y1="165" x2="612" y2="428" stroke="#C8A878" stroke-width="0.6" opacity="0.5"/>
  <line x1="632" y1="165" x2="632" y2="428" stroke="#C8A878" stroke-width="0.6" opacity="0.5"/>
  <text x="578" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Inset door</text>

</svg>
