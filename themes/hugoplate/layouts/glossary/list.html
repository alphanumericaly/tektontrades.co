{{ define "main" }}
{{ partial "page-header.html" . }}

<section class="section">
  <div class="container">

    <!-- Filter Bar -->
    <div class="glossary-filter-bar">
      <p class="filter-label">Filter by category</p>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All Terms</button>
        <button class="filter-btn" data-filter="cabinets">Cabinets</button>
        <button class="filter-btn" data-filter="shelving">Shelving</button>
        <button class="filter-btn" data-filter="tabletops">Table Tops</button>
        <button class="filter-btn" data-filter="furniture">Furniture</button>
        <button class="filter-btn" data-filter="joinery">Joinery</button>
        <button class="filter-btn" data-filter="trim">Trim</button>
        <button class="filter-btn" data-filter="materials">Materials</button>
        <button class="filter-btn" data-filter="hardware">Hardware</button>
        <button class="filter-btn" data-filter="paint">Paint</button>
        <button class="filter-btn" data-filter="stain">Stain</button>
      </div>
    </div>

    <!-- Results Count -->
    <p class="glossary-count">Showing <span id="glossary-count">{{ len .Pages }}</span> terms</p>

    <!-- Glossary Grid -->
    <div class="glossary-grid" id="glossary-grid">
      {{ range .Pages.ByTitle }}
      <div class="glossary-card" data-category="{{ .Params.category }}">
        {{ if .Params.image }}
          <img class="glossary-card-image" src="{{ .Params.image }}" alt="{{ .Title }}" loading="lazy" />
        {{ else }}
          <div class="glossary-card-placeholder">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span>Photo coming soon</span>
          </div>
        {{ end }}
        <div class="glossary-card-body">
          <p class="glossary-card-category">{{ .Params.category }}</p>
          <h3 class="glossary-card-term">{{ .Title }}</h3>
          <p class="glossary-card-definition">{{ .Content | plainify }}</p>
        </div>
      </div>
      {{ end }}
    </div>

  </div>
</section>

<style>
.glossary-filter-bar {
  position: sticky;
  top: 0;
  background: var(--color-body);
  z-index: 10;
  padding: 24px 0 16px;
  border-bottom: 1px solid var(--color-border);
  margin-bottom: 24px;
}
.dark .glossary-filter-bar {
  background: var(--color-darkmode-body);
  border-bottom-color: var(--color-darkmode-border);
}
.filter-label {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-text-light);
  margin-bottom: 12px;
}
.dark .filter-label {
  color: var(--color-darkmode-text-light);
}
.filter-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.filter-btn {
  padding: 8px 18px;
  border: 1.5px solid var(--color-border);
  background: var(--color-body);
  color: var(--color-text);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.2s;
}
.dark .filter-btn {
  background: var(--color-darkmode-body);
  border-color: var(--color-darkmode-border);
  color: var(--color-darkmode-text);
}
.filter-btn:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}
.dark .filter-btn:hover {
  border-color: var(--color-darkmode-primary);
  color: var(--color-darkmode-primary);
}
.filter-btn.active {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: white;
}
.dark .filter-btn.active {
  background: var(--color-darkmode-primary);
  border-color: var(--color-darkmode-primary);
  color: var(--color-darkmode-body);
}
.glossary-count {
  font-size: 0.85rem;
  color: var(--color-text-light);
  margin-bottom: 24px;
}
.dark .glossary-count {
  color: var(--color-darkmode-text-light);
}
.glossary-count span {
  font-weight: 600;
  color: var(--color-text-dark);
}
.dark .glossary-count span {
  color: var(--color-darkmode-text-dark);
}
.glossary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 24px;
}
.glossary-card {
  border: 1px solid var(--color-border);
  background: var(--color-body);
  transition: all 0.25s ease;
  overflow: hidden;
}
.dark .glossary-card {
  border-color: var(--color-darkmode-border);
  background: var(--color-darkmode-light);
}
.glossary-card:hover {
  border-color: var(--color-primary);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
}
.dark .glossary-card:hover {
  border-color: var(--color-darkmode-primary);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.glossary-card.hidden {
  display: none;
}
.glossary-card-image {
  width: 100%;
  height: 320px;
  object-fit: cover;
  display: block;
}
.glossary-card-placeholder {
  width: 100%;
  height: 320px;
  background: var(--color-light);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--color-text-light);
}
.dark .glossary-card-placeholder {
  background: var(--color-darkmode-light);
  color: var(--color-darkmode-text-light);
}
.glossary-card-placeholder span {
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.glossary-card-body {
  padding: 24px;
}
.glossary-card-category {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--color-primary);
  margin-bottom: 8px;
}
.dark .glossary-card-category {
  color: var(--color-darkmode-primary);
}
.glossary-card-term {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--color-text-dark);
  margin-bottom: 12px;
  line-height: 1.2;
}
.dark .glossary-card-term {
  color: var(--color-darkmode-text-dark);
}
.glossary-card-definition {
  font-size: 0.95rem;
  color: var(--color-text);
  line-height: 1.65;
}
.dark .glossary-card-definition {
  color: var(--color-darkmode-text);
}
</style>

<script>
const buttons = document.querySelectorAll('.filter-btn');
const cards = document.querySelectorAll('.glossary-card');
const countEl = document.getElementById('glossary-count');

buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    const filter = btn.dataset.filter;
    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    let visible = 0;
    cards.forEach(card => {
      const match = filter === 'all' || card.dataset.category === filter;
      card.classList.toggle('hidden', !match);
      if (match) visible++;
    });
    countEl.textContent = visible;
  });
});
</script>

{{ end }}
