{{ define "main" }}
{{ partial "page-header.html" . }}

<section class="section">
  <div class="container">

    <!-- Filter Buttons -->
    <div class="portfolio-filter-bar">
      <p class="filter-label">Filter by type</p>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All Projects</button>
        <button class="filter-btn" data-filter="built-ins">Built-ins</button>
        <button class="filter-btn" data-filter="furniture">Furniture</button>
        <button class="filter-btn" data-filter="trim">Trim</button>
        <button class="filter-btn" data-filter="repairs">Repairs</button>
      </div>
    </div>

    <!-- Project Grid -->
    <div class="portfolio-grid" id="portfolio-grid">
      {{ range .Pages.ByDate.Reverse }}
      <a class="portfolio-card" href="{{ .RelPermalink }}" data-category="{{ .Params.category }}">
        {{ if .Params.image }}
          <img class="portfolio-card-image" src="{{ .Params.image }}" alt="{{ .Title }}" loading="lazy" />
        {{ else }}
          <div class="portfolio-card-placeholder">
            <span>Photo coming soon</span>
          </div>
        {{ end }}
        <div class="portfolio-card-body">
          <p class="portfolio-card-category">{{ .Params.category }}</p>
          <h3 class="portfolio-card-title">{{ .Title }}</h3>
          <p class="portfolio-card-desc">{{ .Params.description }}</p>
          <p class="portfolio-card-link">Read the story →</p>
        </div>
      </a>
      {{ end }}
    </div>

  </div>
</section>

<style>
.portfolio-filter-bar {
  padding: 24px 0 16px;
  border-bottom: 1px solid var(--color-border);
  margin-bottom: 32px;
}
.dark .portfolio-filter-bar {
  border-bottom-color: var(--color-darkmode-border);
}
.filter-label {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-text-light);
  margin-bottom: 12px;
}
.dark .filter-label {
  color: var(--color-darkmode-text-light);
}
.filter-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.filter-btn {
  padding: 8px 18px;
  border: 1.5px solid var(--color-border);
  background: var(--color-body);
  color: var(--color-text);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.2s;
}
.dark .filter-btn {
  background: var(--color-darkmode-body);
  border-color: var(--color-darkmode-border);
  color: var(--color-darkmode-text);
}
.filter-btn:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}
.filter-btn.active {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: white;
}
.dark .filter-btn.active {
  background: var(--color-darkmode-primary);
  border-color: var(--color-darkmode-primary);
  color: var(--color-darkmode-body);
}
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 28px;
}
.portfolio-card {
  border: 1px solid var(--color-border);
  background: var(--color-body);
  text-decoration: none;
  display: block;
  transition: all 0.25s ease;
  overflow: hidden;
}
.dark .portfolio-card {
  border-color: var(--color-darkmode-border);
  background: var(--color-darkmode-light);
}
.portfolio-card:hover {
  border-color: var(--color-primary);
  transform: translateY(-3px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.1);
}
.dark .portfolio-card:hover {
  border-color: var(--color-darkmode-primary);
  box-shadow: 0 12px 40px rgba(0,0,0,0.3);
}
.portfolio-card.hidden {
  display: none;
}
.portfolio-card-image {
  width: 100%;
  height: 260px;
  object-fit: cover;
  display: block;
}
.portfolio-card-placeholder {
  width: 100%;
  height: 260px;
  background: var(--color-light);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-text-light);
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.dark .portfolio-card-placeholder {
  background: var(--color-darkmode-light);
  color: var(--color-darkmode-text-light);
}
.portfolio-card-body {
  padding: 24px;
}
.portfolio-card-category {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--color-primary);
  margin-bottom: 8px;
}
.dark .portfolio-card-category {
  color: var(--color-darkmode-primary);
}
.portfolio-card-title {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--color-text-dark);
  margin-bottom: 10px;
  line-height: 1.2;
}
.dark .portfolio-card-title {
  color: var(--color-darkmode-text-dark);
}
.portfolio-card-desc {
  font-size: 0.93rem;
  color: var(--color-text);
  line-height: 1.6;
  margin-bottom: 16px;
}
.dark .portfolio-card-desc {
  color: var(--color-darkmode-text);
}
.portfolio-card-link {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--color-primary);
  letter-spacing: 0.03em;
}
.dark .portfolio-card-link {
  color: var(--color-darkmode-primary);
}
</style>

<script>
const buttons = document.querySelectorAll('.filter-btn');
const cards = document.querySelectorAll('.portfolio-card');

buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    const filter = btn.dataset.filter;
    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    cards.forEach(card => {
      const match = filter === 'all' || card.dataset.category === filter;
      card.classList.toggle('hidden', !match);
    });
  });
});
</script>

{{ end }}
