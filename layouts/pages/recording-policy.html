{{ define "main" }}
  <section class="section-sm">
    <div class="container">
      <div class="row justify-center">
        <div class="lg:col-10">
          <div class="recording-policy">
            <header class="recording-policy-header">
              <h1>{{ .Title }}</h1>
              <p class="recording-policy-subtitle">{{ .Params.description }}</p>
            </header>
            <div class="recording-policy-content">
              {{ .Content }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
{{ end }}
